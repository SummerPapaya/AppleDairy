<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>An Apple A Day 🍎</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/viewer.css" />
  </head>
  <body>
    <svg aria-hidden="true" width="0" height="0" style="position:absolute">
      <defs>
        <clipPath id="apple-clip" clipPathUnits="objectBoundingBox">
          <path transform="scale(0.015625, 0.01724138)"
                d="M32 17C27.4 16.4 22.8 18 20.2 20.4C17.6 17.6 13.8 17.2 11.2 19.4C5.8 21.4 3.2 27 3.2 33.2C3.2 39.6 6.2 45.4 11.6 48.4C15.8 50.6 20.4 51.4 25 50.4C27.4 52.4 29.8 53.8 32 52.8C34.2 53.8 36.6 52.4 39 50.4C43.6 51.4 48.2 50.6 52.4 48.4C57.8 45.4 60.8 39.6 60.8 33.2C60.8 27 58.2 21.4 52.8 19.4C50.2 17.2 46.4 17.6 43.8 20.4C41.2 18 36.6 16.4 32 17Z"/>
        </clipPath>
      </defs>
    </svg>
    <main class="viewer" id="viewer">
      <header class="viewer-head">
        <div class="brand">
          <img class="logo" src="/assets/apple.svg" alt="apple" />
          <div>
            <h1>An Apple A Day</h1>
            <p>a little live photo, every day</p>
          </div>
        </div>

        <div class="mode-toggle" role="tablist" aria-label="View mode">
          <button class="btn is-active" id="btn-calendar" role="tab" aria-selected="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="3" y="4.5" width="18" height="16" rx="2" />
              <path d="M3 9h18M8 2.5v4M16 2.5v4" />
            </svg>
            Calendar
          </button>
          <button class="btn" id="btn-gallery" role="tab" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <circle cx="8.5" cy="8.5" r="1.6" />
              <path d="M21 15l-5-5L5 21" />
            </svg>
            Gallery
          </button>
        </div>
      </header>

      <div class="stage" id="stage">
        <p class="loading-note hand">Picking today's apple…</p>
      </div>
    </main>

    <!-- Lightbox / zoom -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
      <div class="lightbox-card">
        <button class="lightbox-close" id="lightbox-close" aria-label="Close">×</button>
        <div class="lightbox-media" id="lightbox-media"></div>
        <div class="lightbox-cap">
          <div class="desc hand" id="lightbox-desc"></div>
          <div class="date hand" id="lightbox-date"></div>
        </div>
      </div>
    </div>

    <script src="/js/thumb-crop.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
