<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>README Preview · An Apple A Day</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.6.1/github-markdown-light.min.css" />
  <style>
    :root {
      --apple: #e8604c;
      --paper: #fffdf6;
      --ink: #4a423b;
    }
    body {
      margin: 0;
      padding-bottom: 3.25rem;
      background: linear-gradient(180deg, #fdf4e3 0%, var(--paper) 120px, #f8f4ec 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .preview-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.65rem 1.2rem;
      background: rgba(255, 253, 246, 0.92);
      border-bottom: 2px solid #d9cfc1;
      backdrop-filter: blur(8px);
      font-size: 0.88rem;
      color: var(--ink);
    }
    .preview-bar strong { color: var(--apple); }
    .preview-bar a {
      color: var(--apple);
      font-weight: 600;
      text-decoration: none;
    }
    .preview-bar a:hover { text-decoration: underline; }
    .preview-live {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-left: 0.5rem;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #5f8a45;
      background: rgba(135, 176, 103, 0.16);
      border: 1px solid rgba(135, 176, 103, 0.45);
    }
    .preview-live::before {
      content: "";
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: #87b067;
      box-shadow: 0 0 0 2px rgba(135, 176, 103, 0.25);
      animation: live-pulse 1.6s ease-in-out infinite;
    }
    @keyframes live-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.88); }
    }
    .preview-status {
      font-size: 0.78rem;
      color: #8c8178;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 1.5rem 1rem 4rem;
    }
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 920px;
      margin: 0 auto;
      padding: 2rem 2.2rem;
      background: #fff;
      border: 2px solid #d9cfc1;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(74, 66, 59, 0.1);
    }
    .markdown-body img[alt="An Apple A Day logo"],
    .markdown-body img[alt*="animated hero"],
    .markdown-body img[alt*="Calendar mode"],
    .markdown-body img[alt*="Gallery mode"],
    .markdown-body img[alt*="calendar and polaroid"] {
      filter: drop-shadow(0 4px 8px rgba(232, 96, 76, 0.18));
      max-width: 100%;
      height: auto;
    }
    .markdown-body table td[style*="dashed"] {
      background: #fffdfa !important;
    }
    .markdown-body table td[style*="box-shadow"] {
      background: #fdf4e3 !important;
    }
    .markdown-body h1 { border-bottom-color: #f6c453; }
    .markdown-body a { color: var(--apple); }
    .markdown-body blockquote {
      border-left-color: var(--apple);
      background: #fff8f4;
    }
    .loading {
      text-align: center;
      padding: 3rem;
      color: #8c8178;
      font-style: italic;
    }
    .preview-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      margin: 0;
      padding: 0.7rem 1.2rem;
      text-align: center;
      font-size: 0.82rem;
      color: #8c8178;
      background: rgba(255, 253, 246, 0.96);
      border-top: 1.5px dashed #d9cfc1;
      backdrop-filter: blur(8px);
      box-shadow: 0 -2px 12px rgba(74, 66, 59, 0.08);
    }
    .preview-footer a {
      color: var(--apple);
      font-weight: 600;
      text-decoration: none;
    }
    .preview-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="preview-bar">
    <span>
      <strong>README live preview</strong>
      <span class="preview-live" title="Auto-refreshes when README.md changes">Live</span>
      <span id="preview-status" class="preview-status"></span>
    </span>
    <span>
      <a href="/README.md" download>Download README.md</a>
      ·
      <a href="/">Open app</a>
    </span>
  </div>
  <div class="wrap">
    <article id="content" class="markdown-body">
      <p class="loading">Rendering README…</p>
    </article>
  </div>
  <footer id="preview-footer" class="preview-footer">
    README visuals redesigned with
    <a href="https://github.com/oil-oil/beautify-github-readme" target="_blank" rel="noopener">beautify-github-readme</a>
    — animated hero, SVG illustrations, and layout guidance.
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    marked.setOptions({ gfm: true, breaks: false });

    let lastHash = "";

    function hashText(text) {
      let h = 0;
      for (let i = 0; i < text.length; i += 1) {
        h = (Math.imul(31, h) + text.charCodeAt(i)) | 0;
      }
      return String(h);
    }

    function renderReadme(md) {
      const previewMd = md.replace(/src="public\//g, 'src="/');
      document.getElementById("content").innerHTML = marked.parse(previewMd);
    }

    function setStatus(message) {
      const el = document.getElementById("preview-status");
      if (el) el.textContent = message ? `· ${message}` : "";
    }

    async function refreshReadme() {
      try {
        const res = await fetch(`/README.md?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const md = await res.text();
        const nextHash = hashText(md);
        if (nextHash === lastHash) return;
        lastHash = nextHash;
        renderReadme(md);
        setStatus(`updated ${new Date().toLocaleTimeString()}`);
      } catch (e) {
        setStatus(`error: ${e.message}`);
      }
    }

    refreshReadme();
    setInterval(refreshReadme, 2000);
  </script>
</body>
</html>
