<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 136" fill="none" aria-label="An Apple A Day — calendar and gallery hero">
  <!-- soft paper backdrop -->
  <rect x="4" y="6" width="312" height="124" rx="18" fill="#fffdf6" stroke="#d9cfc1" stroke-width="2.2"
        stroke-dasharray="0" opacity="0.95"/>
  <rect x="4" y="6" width="312" height="124" rx="255" ry="18" fill="none" stroke="#4a423b" stroke-width="1.2" opacity="0.12"/>

  <!--  Calendar mini (left)  -->
  <g transform="translate(14, 18)">
    <text x="46" y="10" text-anchor="middle" fill="#8c8178" font-family="system-ui, sans-serif" font-size="7" font-weight="700">JUNE</text>
    <!-- 3×3 date grid -->
    <g stroke="#d9cfc1" stroke-width="1.4" fill="#fffdfa">
      <rect x="4" y="16" width="24" height="24" rx="5" stroke-dasharray="3 2"/>
      <rect x="32" y="16" width="24" height="24" rx="5" stroke-dasharray="3 2"/>
      <rect x="60" y="16" width="24" height="24" rx="5" stroke-dasharray="3 2"/>
      <rect x="4" y="44" width="24" height="24" rx="5" stroke-dasharray="3 2" fill="#fdf4e3"/>
      <rect x="32" y="44" width="24" height="24" rx="5" stroke-dasharray="3 2"/>
      <rect x="60" y="44" width="24" height="24" rx="5" stroke-dasharray="3 2"/>
      <rect x="4" y="72" width="24" height="24" rx="5" stroke-dasharray="3 2"/>
      <rect x="32" y="72" width="24" height="24" rx="5" stroke-dasharray="3 2"/>
      <rect x="60" y="72" width="24" height="24" rx="5" stroke-dasharray="3 2"/>
    </g>
    <!-- today highlight -->
    <rect x="4" y="44" width="24" height="24" rx="5" stroke="#f6c453" stroke-width="1.6" fill="none"/>
    <!-- day numbers -->
    <g fill="#8c8178" font-family="system-ui, sans-serif" font-size="5.5" font-weight="700">
      <text x="10" y="28">1</text>
      <text x="38" y="28">2</text>
      <text x="66" y="28">3</text>
      <text x="10" y="56">4</text>
      <text x="38" y="56">5</text>
      <text x="66" y="56">6</text>
    </g>
    <!-- mini apple thumbnails in cells -->
    <g>
      <!-- apple clip shape helper: day 1 -->
      <ellipse cx="16" cy="34" rx="7" ry="7.5" fill="#e8604c" stroke="#c8472f" stroke-width="1"/>
      <ellipse cx="14" cy="32" rx="2" ry="1.2" fill="#fff" opacity="0.45"/>
      <!-- day 5 -->
      <ellipse cx="44" cy="62" rx="7" ry="7.5" fill="#87b067" stroke="#5f8a45" stroke-width="1"/>
      <!-- day 3 -->
      <ellipse cx="72" cy="34" rx="7" ry="7.5" fill="#f6c453" stroke="#c8972f" stroke-width="1"/>
    </g>
  </g>

  <!--  Center apple (logo)  -->
  <g transform="translate(118, 16) scale(1.35)">
    <path d="M38 13c6-7 14-7 16-5-1 6-7 11-13 11-2 0-4-3×3-6Z"
          fill="#87b067" stroke="#4a423b" stroke-width="2" stroke-linejoin="round"/>
    <path d="M40 14c4-2 9-2 12-2" stroke="#4a423b" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M33 16c0-5 1-8 3-10" stroke="#8a5a3c" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M32 18c-5-4-12-4-16 1-5 6-4 18 2 27 3 5 7 9 11 9 2 0 3-1 3-1s1 1 3 1c4 0 8-4 11-9 6-9 7-21 2-27-4-5-11-5-16-1Z"
          fill="#e8604c" stroke="#4a423b" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M22 27c-2 3-2 7-1 10" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!--  Polaroid mini (right)  -->
  <g transform="translate(228, 22) rotate(-9 36 42)">
    <!-- corkboard grid hint behind -->
    <g stroke="#8a5a3c" stroke-width="0.35" opacity="0.12">
      <path d="M0 0 H78 M0 14 H78 M0 28 H78 M0 42 H78 M0 56 H78 M0 70 H78"/>
      <path d="M0 0 V70 M14 0 V70 M28 0 V70 M42 0 V70 M56 0 V70 M70 0 V70"/>
    </g>
    <!-- polaroid frame -->
    <rect x="6" y="8" width="64" height="78" rx="3" fill="#fffdfa" stroke="#4a423b" stroke-width="1.8"/>
    <!-- tape -->
    <rect x="24" y="2" width="28" height="10" rx="1.5" fill="#f6c453" fill-opacity="0.65"
          stroke="#8a5a3c" stroke-width="0.8" stroke-dasharray="2 1.5" transform="rotate(-4 38 7)"/>
    <!-- photo -->
    <rect x="12" y="14" width="52" height="44" rx="1.5" fill="#efe7da" stroke="#d9cfc1" stroke-width="0.8"/>
    <circle cx="28" cy="32" r="10" fill="#e8604c" opacity="0.85"/>
    <path d="M24 28c2 2 4 2 6 0" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <!-- LIVE badge -->
    <rect x="14" y="16" width="18" height="8" rx="4" fill="#4a423b" fill-opacity="0.45"/>
    <circle cx="17.5" cy="20" r="1.8" fill="none" stroke="#fff" stroke-width="0.8"/>
    <text x="21" y="21.5" fill="#fff" font-family="system-ui, sans-serif" font-size="4.5" font-weight="700">LIVE</text>
    <!-- handwriting caption -->
    <path d="M16 66 Q24 64 32 66 T48 65" stroke="#4a423b" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.55"/>
    <path d="M20 74 Q30 72 40 74 T52 73" stroke="#c8472f" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.45"/>
  </g>

  <!-- sketch labels -->
  <text x="58" y="118" text-anchor="middle" fill="#8c8178" font-family="Georgia, serif" font-size="7" font-style="italic">calendar</text>
  <text x="262" y="118" text-anchor="middle" fill="#8c8178" font-family="Georgia, serif" font-size="7" font-style="italic">gallery</text>
</svg>
