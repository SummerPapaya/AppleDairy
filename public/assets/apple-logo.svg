<svg viewBox="0 0 100 118" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Apple logo">
  <!-- Stem -->
  <path d="M 50 22 C 51 17 54 12 59 7" stroke="#5c3d1e" stroke-width="3" stroke-linecap="round"/>
  <!-- Leaf body -->
  <path d="M 56 16 C 61 7 73 9 71 19 C 69 28 57 24 56 16 Z" fill="#4a8c38" stroke="#2d6b1f" stroke-width="1.8"/>
  <!-- Leaf midrib vein -->
  <path d="M 56 16 C 62 17 67 18 71 19" stroke="#2d6b1f" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Leaf side veins -->
  <path d="M 62 12 C 63 16 64 18 65 21" stroke="#2d6b1f" stroke-width="0.9" stroke-linecap="round" opacity="0.65"/>
  <path d="M 67 14 C 67 17 68 19 68 21" stroke="#2d6b1f" stroke-width="0.9" stroke-linecap="round" opacity="0.5"/>
  <!-- Apple body  two-lobed organic shape -->
  <path d="
    M 42 25
    C 33 19, 14 27, 13 47
    C 12 67, 21 86, 34 98
    C 40 104, 46 108, 50 107
    C 54 108, 60 104, 66 98
    C 79 86, 88 67, 87 47
    C 86 27, 67 19, 58 25
    C 55 21, 53 27, 50 29
    C 47 27, 45 21, 42 25 Z
  " fill="#e85d4a" stroke="#c0392b" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Soft inner glow / body shading on left face -->
  <ellipse cx="33" cy="52" rx="13" ry="20" fill="#f5a090" opacity="0.32" transform="rotate(-14 33 52)"/>
  <!-- Primary shine stroke -->
  <path d="M 27 39 C 24 50 24 63 28 70" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.52"/>
  <!-- Secondary small shine -->
  <path d="M 33 32 C 31 37 31 42 33 44" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.38"/>
  <!-- Bottom centre indent marks -->
  <path d="M 44 105 C 46 110 50 111 50 107" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 56 105 C 54 110 50 111 50 107" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round"/>
</svg>
